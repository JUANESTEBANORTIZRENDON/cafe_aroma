version: '3.8'

services:
  cafe-aroma:
    build: .
    ports:
      - "5000:5000"
    environment:
      # Variables de entorno para SMTP
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - SECRET_KEY=${SECRET_KEY:-dev-key-change-in-production}
    volumes:
      # Montar el código para desarrollo (opcional)
      - .:/app
    restart: unless-stopped
    container_name: cafe-aroma-app
